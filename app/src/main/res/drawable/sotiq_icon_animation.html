
<!DOCTYPE html>
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 0; min-height: 360px;">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap');

  .scene {
    position: relative;
    width: 120px;
    height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* String hanging from above */
  .string {
    width: 2.5px;
    height: 36px;
    background: #A0B8AC;
    border-radius: 2px;
    transform-origin: top center;
    animation: stringFall 0.4s ease-out 0.1s both;
  }
  @keyframes stringFall {
    from { transform: scaleY(0); opacity: 0; }
    to   { transform: scaleY(1); opacity: 1; }
  }

  /* Tag body */
  .tag {
    width: 100px;
    height: 115px;
    background: #1A6B3C;
    border-radius: 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: top center;
    animation:
      tagDrop 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.45s both,
      tagSwing 3s ease-in-out 1.2s infinite;
  }

  @keyframes tagDrop {
    from { transform: translateY(-40px) scale(0.4) rotate(-20deg); opacity: 0; }
    to   { transform: translateY(0)     scale(1)   rotate(0deg);   opacity: 1; }
  }

  /* gentle idle sway */
  @keyframes tagSwing {
    0%,100% { transform: rotate(0deg); }
    25%      { transform: rotate(3deg); }
    75%      { transform: rotate(-3deg); }
  }

  /* Hole */
  .hole {
    position: absolute;
    top: 13px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #F9F7F4;
    animation: holePop 0.3s cubic-bezier(0.34,1.56,0.64,1) 0.95s both;
  }
  @keyframes holePop {
    from { transform: translateX(-50%) scale(0); }
    to   { transform: translateX(-50%) scale(1); }
  }

  /* S letter */
  .letter {
    font-family: 'Nunito', 'Arial Rounded MT Bold', sans-serif;
    font-weight: 900;
    font-size: 68px;
    color: #fff;
    line-height: 1;
    margin-top: 12px;
    animation: letterPop 0.45s cubic-bezier(0.34,1.56,0.64,1) 1.05s both;
  }
  @keyframes letterPop {
    from { transform: scale(0) rotate(10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);  opacity: 1; }
  }

  /* Shine sweep across tag */
  .shine {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    overflow: hidden;
    pointer-events: none;
  }
  .shine::after {
    content: '';
    position: absolute;
    top: -60%;
    left: -80%;
    width: 60%;
    height: 220%;
    background: rgba(255,255,255,0.18);
    transform: skewX(-20deg);
    animation: shineSweep 0.6s ease-out 1.4s both;
  }
  @keyframes shineSweep {
    from { left: -80%; }
    to   { left: 160%; }
  }

  /* Replay button */
  .replay-btn {
    margin-top: 48px;
    padding: 9px 28px;
    border-radius: 999px;
    border: 1.5px solid var(--color-border-secondary);
    background: transparent;
    color: var(--color-text-secondary);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .replay-btn:hover {
    background: #1A6B3C;
    color: #fff;
    border-color: #1A6B3C;
  }
</style>

<div class="scene" id="scene">
  <div class="string"></div>
  <div class="tag">
    <div class="shine"></div>
    <div class="hole"></div>
    <span class="letter">S</span>
  </div>
</div>

<button class="replay-btn" onclick="replay()">↺ Replay</button>

<script>
function replay() {
  const scene = document.getElementById('scene');
  const fresh = scene.cloneNode(true);
  scene.replaceWith(fresh);
  fresh.id = 'scene';
}
</script>
</div>
